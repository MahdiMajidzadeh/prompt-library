<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Prompt Library — Mobile</title>
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/components.css" />
<style>
  :root {
    --safe-top: 54px;   /* clears the status bar inside the device frame */
    --safe-bottom: 20px;/* clears the home indicator */
    --tabbar-h: 64px;
  }
  html, body { height: 100%; }
  body {
    overflow-x: hidden;
    padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom));
  }

  /* ---- compact mobile header ---- */
  .m-header {
    position: sticky; top: 0; z-index: 50;
    padding-top: var(--safe-top);
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: var(--border-hairline) solid var(--border);
  }
  .m-header__bar {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
  }
  .m-header__wordmark { display: flex; align-items: center; gap: var(--space-2); font-weight: var(--weight-semibold); font-size: var(--text-md); letter-spacing: var(--tracking-snug); }
  .m-header__spacer { margin-left: auto; }
  .m-iconbtn {
    width: 40px; height: 40px; display: inline-grid; place-items: center;
    border-radius: var(--radius-md); border: var(--border-hairline) solid var(--border);
    background: var(--surface); color: var(--text-secondary); cursor: pointer;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .m-iconbtn:active { background: var(--surface-soft); }
  .m-iconbtn svg { width: 19px; height: 19px; }

  /* search row under the bar */
  .m-search { padding: 0 var(--space-4) var(--space-3); }
  .m-search .pl-search__input { height: 46px; }

  /* ---- intro ---- */
  .m-intro { padding: var(--space-6) var(--space-4) var(--space-5); }
  .m-intro__title { font-size: var(--text-2xl); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); line-height: 1.08; margin: 0 0 var(--space-2); }
  .m-intro__desc { font-size: var(--text-base); color: var(--text-secondary); margin: 0; line-height: var(--leading-snug); text-wrap: pretty; }
  .m-intro__meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2) var(--space-3); margin-top: var(--space-4); font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-tertiary); letter-spacing: var(--tracking-wide); }
  .m-intro__meta span { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
  .m-intro__dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border-strong); }

  /* ---- section ---- */
  .m-section { margin-bottom: var(--space-7); }
  .m-section__head {
    display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3);
    padding: 0 var(--space-4); margin-bottom: var(--space-4);
  }
  .m-section__title { font-size: var(--text-lg); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-snug); margin: 0; }
  .m-viewall { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--accent); white-space: nowrap; }
  .m-viewall svg { width: 15px; height: 15px; }

  /* horizontal card rail (native-feeling) */
  .m-rail {
    display: flex; gap: var(--space-3);
    overflow-x: auto; scroll-snap-type: x mandatory;
    padding: var(--space-1) var(--space-4) var(--space-3);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .m-rail::-webkit-scrollbar { display: none; }
  .m-rail > .pl-card {
    flex: 0 0 84%; max-width: 320px;
    scroll-snap-align: start;
  }
  /* touch devices: copy icon always visible (no hover) */
  .m-rail .pl-card__copy { opacity: 1; transform: none; }

  /* browse by tag — 2-col grid */
  .m-taggrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); padding: 0 var(--space-4); }
  .m-tagtile {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
    padding: var(--space-4); min-height: 56px;
    background: var(--surface); border: var(--border-hairline) solid var(--border);
    border-radius: var(--radius-md);
  }
  .m-tagtile:active { background: var(--surface-soft); }
  .m-tagtile__name { font-size: var(--text-sm); font-weight: var(--weight-medium); text-transform: capitalize; }
  .m-tagtile__count { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-tertiary); }

  /* footer */
  .m-footer { padding: var(--space-6) var(--space-4) var(--space-7); border-top: var(--border-hairline) solid var(--border); text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
  .m-footer__links { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-3) var(--space-5); }
  .m-footer__link { font-size: var(--text-sm); color: var(--text-secondary); }
  .m-footer__copy { font-size: var(--text-xs); color: var(--text-tertiary); }

  /* ---- bottom tab bar ---- */
  .m-tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex; align-items: stretch;
    padding-bottom: var(--safe-bottom);
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: var(--border-hairline) solid var(--border);
  }
  .m-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    height: var(--tabbar-h); min-width: 44px;
    color: var(--text-tertiary); background: none; border: none; cursor: pointer;
    font-family: var(--font-ui); font-size: 11px; font-weight: var(--weight-medium); letter-spacing: var(--tracking-snug);
  }
  .m-tab svg { width: 23px; height: 23px; }
  .m-tab--active { color: var(--accent); }

  /* card preview: a touch shorter on mobile */
  .m-rail .pl-card__preview { -webkit-line-clamp: 3; font-size: var(--text-sm); }
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="m-header">
  <div class="m-header__bar">
    <span class="m-header__wordmark"><span class="pl-wordmark__mark pl-wordmark__mark--accent">P</span> Prompt Library</span>
    <span class="m-header__spacer"></span>
    <button class="m-iconbtn" id="themeToggle" aria-label="Toggle dark mode"></button>
  </div>
</header>

<main>
  <!-- intro -->
  <section class="m-intro">
    <h1 class="m-intro__title">Prompt Library</h1>
    <p class="m-intro__desc">Browse, search, and copy curated prompts.</p>
    <div class="m-intro__meta">
      <span>1,204 prompts</span>
      <span class="m-intro__dot"></span>
      <span>6 categories</span>
      <span class="m-intro__dot"></span>
      <span>updated daily</span>
    </div>
  </section>

  <!-- recently added -->
  <section class="m-section">
    <div class="m-section__head">
      <h2 class="m-section__title">Recently added</h2>
      <a class="m-viewall" href="Prompts.html">View all <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
    <div class="m-rail" id="recentRail"></div>
  </section>

  <!-- most viewed -->
  <section class="m-section">
    <div class="m-section__head">
      <h2 class="m-section__title">Most viewed</h2>
      <a class="m-viewall" href="Prompts.html">View all <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
    <div class="m-rail" id="popularRail"></div>
  </section>

  <!-- browse by tag -->
  <section class="m-section">
    <div class="m-section__head">
      <h2 class="m-section__title">Browse by tag</h2>
    </div>
    <div class="m-taggrid" id="tagGrid"></div>
  </section>

  <!-- footer -->
  <footer class="m-footer">
    <span class="m-header__wordmark" style="font-size:var(--text-base)"><span class="pl-wordmark__mark">P</span> Prompt Library</span>
    <nav class="m-footer__links">
      <a class="m-footer__link" href="Prompts.html">Browse</a>
      <a class="m-footer__link">Categories</a>
      <a class="m-footer__link">Submit</a>
      <a class="m-footer__link">About</a>
    </nav>
    <span class="m-footer__copy">© 2026 Prompt Library</span>
  </footer>
</main>

<!-- ============ BOTTOM TAB BAR ============ -->
<nav class="m-tabbar">
  <button class="m-tab m-tab--active" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    Home
  </button>
  <button class="m-tab" aria-label="Search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    Search
  </button>
  <button class="m-tab" aria-label="Tags">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59A2 2 0 0 0 3.59 11l9.58 9.59a2 2 0 0 0 2.83 0l4.59-4.59a2 2 0 0 0 0-2.83Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
    Tags
  </button>
</nav>

<script>
/* ---- content (same data as desktop Home) ---- */
const RECENT = [
  { title: 'Summarize a long article', preview: 'Summarize the article below in 5 bullet points, then one sentence a busy executive could act on. Keep it neutral.', tags: ['writing','analysis'], views: '1.2k' },
  { title: 'Rewrite copy in a friendly tone', preview: 'Rewrite the text below to sound warm and conversational without losing meaning. Shorten long sentences.', tags: ['writing','marketing'], views: '2.4k' },
  { title: 'Generate SQL from a question', preview: 'Given this schema, write a single SQL query that answers the question. Explain any joins in one line.', tags: ['coding','analysis'], views: '3.8k' },
  { title: 'Turn notes into a brief', preview: 'Convert these rough notes into a one-page creative brief: objective, audience, key message, deliverables.', tags: ['marketing','productivity'], views: '980' },
  { title: 'Brainstorm product names', preview: 'Generate 20 short, brandable names for the product described below. Mix invented and real words. No hyphens.', tags: ['creative','marketing'], views: '1.1k' },
];
const POPULAR = [
  { title: 'Code review buddy', preview: 'Review this code for bugs, edge cases, and readability. List issues by severity, then suggest concrete fixes.', tags: ['coding'], views: '18.4k' },
  { title: 'Explain it simply', preview: 'Explain the concept below to a smart 12-year-old. Use one everyday analogy. Define any term you can\'t avoid.', tags: ['writing','productivity'], views: '14.9k' },
  { title: 'Meeting notes → action items', preview: 'From the transcript below, extract decisions and action items as a table: owner, task, due date.', tags: ['productivity'], views: '12.2k' },
  { title: 'Polish my email', preview: 'Rewrite this email to be clear, polite, and concise. Keep my voice. Suggest a subject line.', tags: ['writing'], views: '11.0k' },
  { title: 'Plan a project', preview: 'Break the goal below into phases with milestones and rough estimates. Call out risks and dependencies.', tags: ['productivity','analysis'], views: '9.6k' },
];
const TAGS = [
  { name: 'writing', count: '312' }, { name: 'coding', count: '287' },
  { name: 'marketing', count: '194' }, { name: 'productivity', count: '156' },
  { name: 'analysis', count: '143' }, { name: 'creative', count: '128' },
];

const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const EYE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';

function escapeAttr(s){ return s.replace(/"/g,'&quot;'); }
function tagPills(tags){ return tags.map(t => `<span class="pl-tag">${t}</span>`).join(''); }

function card(p, rank) {
  const title = rank
    ? `<span class="pl-card__rank">${String(rank).padStart(2,'0')}</span> &nbsp;${p.title}`
    : p.title;
  return `
  <article class="pl-card ${rank?'pl-card--ranked':''}" tabindex="0" data-copy="${escapeAttr(p.preview)}">
    <div class="pl-card__head">
      <h3 class="pl-card__title">${title}</h3>
      <button class="pl-copy-icon pl-card__copy" aria-label="Copy prompt" data-copy="${escapeAttr(p.preview)}">${COPY_ICON}</button>
    </div>
    <pre class="pl-card__preview">${p.preview}</pre>
    <div class="pl-card__foot">
      <div class="pl-card__tags">${tagPills(p.tags)}</div>
      <span class="pl-meta">${EYE_ICON} ${p.views}</span>
    </div>
  </article>`;
}

document.getElementById('recentRail').innerHTML = RECENT.map(p => card(p)).join('');
document.getElementById('popularRail').innerHTML = POPULAR.map((p,i) => card(p, i+1)).join('');
document.getElementById('tagGrid').innerHTML = TAGS.map(t =>
  `<a class="m-tagtile" href="Prompts.html"><span class="m-tagtile__name">${t.name}</span><span class="m-tagtile__count">${t.count}</span></a>`).join('');

/* copy interaction */
document.querySelectorAll('[data-copy]').forEach(el => {
  el.addEventListener('click', (e) => {
    const btn = e.target.closest('.pl-copy-icon');
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    const text = el.getAttribute('data-copy');
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
    btn.classList.add('is-copied'); const orig = btn.innerHTML; btn.innerHTML = CHECK_ICON;
    setTimeout(() => { btn.classList.remove('is-copied'); btn.innerHTML = orig; }, 1600);
  });
});

/* theme + accent (shared keys, plus query-param override for previews) */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('pl-theme', t);
  document.getElementById('themeToggle').innerHTML = t === 'dark' ? MOON : SUN;
}
document.getElementById('themeToggle').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

const params = new URLSearchParams(location.search);
const ACCENTS = { indigo:['#4F46E5','#4338CA'], terracotta:['#C2410C','#9A3412'], forest:['#15803D','#166534'], slate:['#1E40AF','#1E3A8A'], plum:['#9333EA','#7E22CE'] };
const accent = params.get('accent') || localStorage.getItem('pl-accent') || 'plum';
if (ACCENTS[accent]) {
  document.documentElement.style.setProperty('--accent', ACCENTS[accent][0]);
  document.documentElement.style.setProperty('--accent-hover', ACCENTS[accent][1]);
}
applyTheme(params.get('theme') || localStorage.getItem('pl-theme') || 'light');
</script>
</body>
</html>
