<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prompt Library — Mobile Home</title>
<link rel="stylesheet" href="styles/tokens.css" />
<style>
  body {
    margin: 0; background: #EDECEA;
    font-family: var(--font-ui);
    min-height: 100vh;
    padding: 56px 24px 80px;
    box-sizing: border-box;
  }
  .stage-head { max-width: 920px; margin: 0 auto 40px; }
  .stage-eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #8A8780; margin: 0 0 10px; }
  .stage-title { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; color: #171717; margin: 0 0 8px; }
  .stage-sub { font-size: 15px; color: #57534E; margin: 0; max-width: 560px; line-height: 1.5; }

  .devices {
    display: flex; flex-wrap: wrap; gap: 64px;
    justify-content: center; align-items: flex-start;
  }
  .device-col { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .device-label { font-size: 13px; font-weight: 500; color: #57534E; font-family: var(--font-mono); letter-spacing: 0.02em; }

  .pl-frame { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
</style>
</head>
<body>
  <div class="stage-head">
    <p class="stage-eyebrow">Prompt Library · Responsive</p>
    <h1 class="stage-title">Mobile home</h1>
    <p class="stage-sub">The home screen reworked for small screens: a compact sticky header with inline search, swipeable card rails for each section, a two-column tag grid, and a bottom tab bar for primary navigation.</p>
  </div>

  <div id="root" class="devices"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel">
    function Phone({ theme, accent, label }) {
      const src = `Home%20Mobile.html?theme=${theme}&accent=${accent}`;
      return (
        <div className="device-col">
          <IOSDevice dark={theme === 'dark'}>
            <iframe className="pl-frame" src={src} title={label}></iframe>
          </IOSDevice>
          <span className="device-label">{label}</span>
        </div>
      );
    }
    function App() {
      return (
        <React.Fragment>
          <Phone theme="light" accent="indigo" label="Light" />
          <Phone theme="dark" accent="indigo" label="Dark" />
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
